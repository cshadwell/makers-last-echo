<!doctype html>
<html lang="en"><head><link rel="preload" as="image" href="assets/web/cottage.jpg" fetchpriority="high"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Maker's Last Echo</title><link rel="stylesheet" href="style.css?v=poem-fade-1"></head>
<body class="prologue-playing cinematic-entry opening-black cottage-entry">
<div id="cottage-entry" class="cottage-entry-screen" aria-label="A lantern-lit cottage doorway">
<div class="cottage-picture">
<img id="cottage-image" src="assets/web/cottage.jpg" fetchpriority="high" width="1672" height="941" alt="A still wooden cottage door with a brass dragon knocker between two warm leaded windows.">
<button id="knocker-entry" class="knocker-entry" aria-label="Knock to enter the studio" title="Knock to enter the studio" disabled></button>
<div class="knocker-frames" aria-hidden="true"><img class="knocker-frame knocker-frame-1" data-src="assets/web/knocker-1.jpg" width="320" height="449" alt=""><img class="knocker-frame knocker-frame-2" data-src="assets/web/knocker-2.jpg" width="320" height="449" alt=""><img class="knocker-frame knocker-frame-3" data-src="assets/web/knocker-3.jpg" width="320" height="449" alt=""><img class="knocker-frame knocker-frame-4" data-src="assets/web/knocker-4.jpg" width="320" height="449" alt=""></div>
<svg viewBox="0 0 1672 941" aria-hidden="true" class="cottage-lighting" hidden>
<defs>
  <!-- Derive the lead-strip mask from the supplied pixels, rather than painting over the lattice. -->
  <filter id="glass-luminance" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncR type="linear" slope="5" intercept="-1"/><feFuncG type="linear" slope="5" intercept="-1"/><feFuncB type="linear" slope="5" intercept="-1"/></feComponentTransfer>
  </filter>
  <mask id="cottage-glass" maskUnits="userSpaceOnUse" x="0" y="0" width="1672" height="941" style="mask-type:luminance">
    <image data-href="assets/web/cottage.jpg" width="1672" height="941" filter="url(#glass-luminance)"/>
  </mask>
  <radialGradient id="cottage-reflection"><stop stop-color="#f8a84e" stop-opacity=".36"/><stop offset=".65" stop-color="#df852c" stop-opacity=".14"/><stop offset="1" stop-color="#df852c" stop-opacity="0"/></radialGradient>

  <filter id="firelit-texture" color-interpolation-filters="sRGB">
    <feComponentTransfer><feFuncR type="linear" slope="1.26"/><feFuncG type="linear" slope="1.12"/><feFuncB type="linear" slope=".92"/></feComponentTransfer>
  </filter>
  <radialGradient id="fire-patch-falloff"><stop stop-color="white"/><stop offset=".35" stop-color="white" stop-opacity=".85"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
<clipPath id="panes-left" clipPathUnits="userSpaceOnUse"><path d="M225 174 L312 175 L311 285 L219 284 Z M334 176 L420 179 L418 287 L331 285 Z M218 305 L310 307 L309 432 L215 431 Z M332 307 L418 307 L416 432 L330 432 Z"/></clipPath>
<mask id="fire-left" maskUnits="userSpaceOnUse" x="0" y="0" width="1672" height="941" style="mask-type:luminance"><g data-fire-window="left"><ellipse class="fire-patch" cx="0" cy="0" rx="95" ry="110" fill="url(#fire-patch-falloff)"/><ellipse class="fire-patch" cx="0" cy="0" rx="95" ry="110" fill="url(#fire-patch-falloff)"/><ellipse class="fire-patch" cx="0" cy="0" rx="95" ry="110" fill="url(#fire-patch-falloff)"/></g></mask>
<clipPath id="panes-right" clipPathUnits="userSpaceOnUse"><path d="M1257 181 L1344 181 L1346 289 L1259 289 Z M1364 181 L1451 183 L1455 290 L1365 290 Z M1260 310 L1348 310 L1350 438 L1263 436 Z M1366 311 L1456 312 L1458 438 L1370 438 Z"/></clipPath>
<mask id="fire-right" maskUnits="userSpaceOnUse" x="0" y="0" width="1672" height="941" style="mask-type:luminance"><g data-fire-window="right"><ellipse class="fire-patch" cx="0" cy="0" rx="95" ry="110" fill="url(#fire-patch-falloff)"/><ellipse class="fire-patch" cx="0" cy="0" rx="95" ry="110" fill="url(#fire-patch-falloff)"/><ellipse class="fire-patch" cx="0" cy="0" rx="95" ry="110" fill="url(#fire-patch-falloff)"/></g></mask>
</defs>
<g data-window="left">
  <ellipse class="window-reflection" cx="318" cy="350" rx="184" ry="235" fill="url(#cottage-reflection)"/>
  <g mask="url(#cottage-glass)">
    <path class="window-dim" d="M225 174 L312 175 L311 285 L219 284 Z M334 176 L420 179 L418 287 L331 285 Z M218 305 L310 307 L309 432 L215 431 Z M332 307 L418 307 L416 432 L330 432 Z"/>
    <g clip-path="url(#panes-left)"><image class="window-fire" data-href="assets/web/cottage.jpg" width="1672" height="941" filter="url(#firelit-texture)" mask="url(#fire-left)"/></g>
  </g>
</g>
<g data-window="right">
  <ellipse class="window-reflection" cx="1358" cy="355" rx="178" ry="238" fill="url(#cottage-reflection)"/>
  <g mask="url(#cottage-glass)">
    <path class="window-dim" d="M1257 181 L1344 181 L1346 289 L1259 289 Z M1364 181 L1451 183 L1455 290 L1365 290 Z M1260 310 L1348 310 L1350 438 L1263 436 Z M1366 311 L1456 312 L1458 438 L1370 438 Z"/>
    <g clip-path="url(#panes-right)"><image class="window-fire" data-href="assets/web/cottage.jpg" width="1672" height="941" filter="url(#firelit-texture)" mask="url(#fire-right)"/></g>
  </g>
</g>
</svg>
</div></div>
<button id="skip-prologue" hidden>Skip Prologue</button>
<div id="prologue-recovery" class="prologue-recovery" hidden>
  <p role="status">Tap to enable narration, or retry if playback was interrupted.</p>
  <button id="retry-prologue">Resume narration</button>
</div>
<div id="handoff-curtain" aria-hidden="true"></div>
<audio id="prologue-audio" preload="auto" hidden></audio>
<header class="workshop-title"><p class="eyebrow">THE LAST THRESHOLD</p><h1>The Maker’s Last Echo</h1><p class="intro">What was left in silence may yet be heard.</p></header>
<div class="workshop-layout" id="layout">
<aside class="workshop-setting" aria-label="The Maker’s workshop">
<div class="scene-frame"><div class="scene-stage" id="scene-stage">
<div class="scene" id="scene"><img id="workshop-image" data-src="assets/web/workshop.jpg" alt="An unoccupied workshop with puzzle figures and maps on the table. A basset hound statue and dragon shield stand in the left doorway; the brass eye medallion hangs above a rune chart and maze on the right." width="1660" height="948"><div class="doorway-glow" aria-hidden="true"></div><div class="floor-spill" aria-hidden="true"></div><div class="light-shaft" aria-hidden="true"></div><div class="air-haze" aria-hidden="true"><i></i><i></i><i></i></div><div id="dust" aria-hidden="true"></div><div class="scene-dimmer" aria-hidden="true"></div></div>
<div class="scene scene-workbench" id="workbench-scene" hidden>
  <img id="workbench-image" data-src="assets/web/workbench.jpg" alt="Lantern-lit workbench with a wooden gear mechanism, tools, an ornate box and a framed portrait." width="1672" height="941">
  <div class="lantern-glow" aria-hidden="true"></div>
  <div class="light-shaft" aria-hidden="true"></div>
  <div class="scene-dust" aria-hidden="true"></div>
</div>
<div class="scene scene-workbench scene-writing" id="writing-scene" hidden>
  <img data-src="assets/web/writing-desk.jpg" alt="An unfinished parchment beside a lantern, quill and ink bottle, with a blurred portrait behind the desk." width="1672" height="941">
  <div class="lantern-glow" aria-hidden="true"></div>
  <div class="scene-dust" aria-hidden="true"></div>
</div>

<div class="scene scene-workbench scene-finished-piano" id="finished-piano-scene" hidden>
 <div class="finished-piano-art">
 <img data-src="assets/web/finished-piano.jpg" alt="The finished walnut piano with four blank parchment windows beside a warm fireplace." width="1672" height="941">
<div class="scene-dust" aria-hidden="true"></div>
 </div>
</div>

</div></div>
<div class="arrival" id="arrival"><p id="intro-status" role="status">The workshop stands empty. Enter when you are ready.</p><div class="controls"><button id="enter-workshop" disabled>Enter the studio</button><button id="resume-workshop" hidden>Resume saved puzzle</button><button id="replay-intro" hidden>Replay Introduction</button></div><p id="motion-status" class="small" hidden></p><p id="scene-status" role="status"></p></div>
</aside>
<main id="puzzle" hidden tabindex="-1" aria-label="The Maker’s final line">
  <div id="stanza-panels" class="stanza-panels"></div>
  <div id="stanza-readalong" class="stanza-readalong" hidden aria-label="Current stanza"></div>
  <div class="final-line-control"><button id="complete-line" disabled>Complete the final line</button></div>
  <div id="stanza-recovery" class="stanza-recovery" hidden>
    <p id="stanza-status" role="status"></p>
    <button id="retry-stanza">Retry playback</button>
  </div>
  <p id="final-victory" role="status" hidden>The final line is found. The Maker’s work is complete.</p>
  <p id="save-status" role="status" hidden></p>
  <div class="keyboard-art" id="keyboard-art">
    <img id="keyboard-image" alt="Aged handmade piano keyboard">
    <div id="future-key-regions" role="group" aria-label="Piano keyboard"></div>
  </div>
<p id="piano-status" role="status" hidden></p>
</main>
</div>
<dialog id="line-dialog" aria-labelledby="line-label">
  <form id="line-form">
    <div class="full-poem-sheet">
      <img id="full-poem-image" alt="The Maker’s poem, with space for its missing final line">
      <div id="full-poem-text" class="full-poem-text"></div>
      <div class="parchment-entry">
        <label for="missing-line" id="line-label">The missing final line</label>
        <input id="missing-line" autocomplete="off" spellcheck="false" required>
      </div>
    </div>
    <p id="line-feedback" role="status"></p>
    <div class="dialog-actions"><button type="submit">Submit</button><button id="cancel-line" type="button">Cancel</button></div>
  </form>
</dialog>
<script type="module" src="app.js?v=poem-fade-1"></script></body></html>
